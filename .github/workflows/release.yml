name: Native releases

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    uses: ./.github/workflows/build.yml
  publish:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - name: Publish packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
