name: Build and test packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows-x64, os: windows-2022 }
          - { name: macOS-x64, os: macos-15-intel }
          - { name: macOS-arm64, os: macos-15 }
          - { name: Linux-x64, os: ubuntu-24.04 }
          - { name: Linux-arm64, os: ubuntu-24.04-arm }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-espresso-ci
          npx playwright install-deps chromium
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get install -y libcurl4-openssl-dev xvfb
      - run: npm run format:check
      - run: npm test
      - run: npm run build:ui
      - name: Test desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Test desktop on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Build native package
        run: node scripts/package.mjs
      - name: Test packaged app on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Test packaged app on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - name: Generate checksum
        run: node scripts/checksum.mjs
      - name: Store package and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.name }}
          compression-level: 0
          path: |
            release/ESPresso-*.exe
            release/ESPresso-*.zip
            release/ESPresso-*.tar.gz
            release/ESPresso-*.sha256
          if-no-files-found: error
      - name: Store screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots-${{ matrix.name }}
          path: test-results/
          if-no-files-found: ignore
